name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          load: true
          context: .
          tags: chrissx/redirector:latest
      - name: Test image
        timeout-minutes: 2
        run: |
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          docker run -d --name smoke -p 127.0.0.1:8080:80 chrissx/redirector:latest
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 --max-time 2 --retry-max-time 30 http://127.0.0.1:8080/ -o /dev/null
          test "$(curl -sS --max-time 2 -o /dev/null -w '%{http_code} %{redirect_url}' -H 'Host: example.com' http://127.0.0.1:8080/smoke)" = '301 https://example.com/smoke'
      - uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          platforms: linux/amd64,linux/arm64
          tags: chrissx/redirector:latest
